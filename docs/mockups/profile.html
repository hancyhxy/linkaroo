<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AussieBridge - Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Public+Sans:ital,wght@0,400;0,700;0,800;0,900;1,900&family=Liberation+Serif:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Public Sans', sans-serif; }
    .font-inter { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-200 flex justify-center">
  <div class="w-[390px] min-h-screen relative" style="background-color: #f7f9ff;">

    <!-- Content -->
    <div class="px-5 pb-32">

      <!-- Identity Hero (centered, vertical) -->
      <div class="mt-12 mb-8 flex flex-col items-center">
        <div class="w-24 h-24 rounded-full flex items-center justify-center text-4xl font-bold mb-4 shadow-sm" style="background: linear-gradient(135deg, #39acff, #00639b); color: white;">
          A
        </div>
        <h1 class="text-2xl font-bold leading-tight" style="color: #171c21;">Amara D.</h1>
        <p class="text-sm mt-1" style="color: #3f4851;">u/amara_d</p>
      </div>

      <!-- Profile Field Block -->
      <div class="rounded-2xl bg-white border border-gray-200 overflow-hidden mb-4">

        <!-- Field: Language -->
        <div class="px-4 py-3 border-b border-gray-100">
          <div class="text-[11px] font-semibold tracking-wide uppercase mb-1" style="color: #3f4851;">Preferred Language</div>
          <div class="flex items-center gap-2 text-sm font-medium" style="color: #171c21;">
            <span>🇬🇧</span>
            <span>English</span>
          </div>
        </div>

        <!-- Field: Status -->
        <div class="px-4 py-3 border-b border-gray-100">
          <div class="text-[11px] font-semibold tracking-wide uppercase mb-1" style="color: #3f4851;">Current Status</div>
          <div class="flex items-center gap-2 text-sm font-medium" style="color: #171c21;">
            <span class="inline-flex items-center justify-center w-5 h-5 rounded-full" style="background: #e8f4ff;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#00639b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
            </span>
            <span>Immigrant Student</span>
          </div>
        </div>

        <!-- Field: Location -->
        <div class="px-4 py-3 border-b border-gray-100">
          <div class="text-[11px] font-semibold tracking-wide uppercase mb-1" style="color: #3f4851;">Location</div>
          <div class="flex items-center gap-2 text-sm font-medium" style="color: #171c21;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00639b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>Sydney, NSW</span>
          </div>
        </div>

        <!-- Field: Duration -->
        <div class="px-4 py-3">
          <div class="text-[11px] font-semibold tracking-wide uppercase mb-1" style="color: #3f4851;">Duration in Australia</div>
          <div class="flex items-center gap-2 text-sm font-medium" style="color: #171c21;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00639b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>1-6 months</span>
          </div>
        </div>
      </div>

      <!-- Why we ask (compact) -->
      <div class="rounded-2xl px-4 py-3 mb-6 flex items-center gap-3" style="background-color: #ffddb7;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171c21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p class="text-xs leading-snug" style="color: #171c21;"><span class="font-semibold">Why we ask</span> — these fields drive personalization. Update them anytime to get more relevant guides, Q&A, and volunteer matches.</p>
      </div>

      <!-- Edit Profile (re-enters OnboardingView with prefilled ABUser) -->
      <button class="w-full py-3.5 rounded-2xl bg-white text-sm font-semibold flex items-center justify-center gap-2 transition-shadow hover:shadow-md" style="color: #171c21; border: 1px solid rgba(0, 30, 47, 0.08);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00639b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Edit profile
      </button>

    </div>

  </div>
</body>
</html>
